<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPU-SMI Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23111'/%3E%3Ctext x='32' y='45' font-family='Consolas,monospace' font-size='40' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>NPU-SMI Monitor</h1>
  <span id="refresh-time" class="refresh-time"></span>
</header>

<main>
  <div id="hosts" class="hosts-grid"></div>
  <p class="hint">重叠仅提示不拦截，请自行协调。只能排未来一周内的占用。</p>
</main>

<footer>
  <div class="dot-grid">
    <div class="dots dots-sm"></div>
    <div class="dots dots-md"></div>
    <div class="dots dots-lg"></div>
  </div>
  <div id="big-clock" class="big-clock"></div>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
